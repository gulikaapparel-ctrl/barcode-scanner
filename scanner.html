<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Scanner</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0F172A;color:#F1F5F9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}
    h1{font-size:18px;font-weight:700;color:#60A5FA;margin-top:4px}
    .sub{font-size:12px;color:#94A3B8;text-align:center;margin-top:-4px}
    .video-wrap{width:100%;max-width:440px;position:relative;border-radius:14px;overflow:hidden;border:2px solid #3B82F6;background:#000;min-height:260px}
    video{width:100%;display:block}
    canvas#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
    .scan-line{position:absolute;left:0;right:0;height:3px;background:rgba(59,130,246,0.9);border-radius:2px;animation:scanMove 1.8s ease-in-out infinite;box-shadow:0 0 8px rgba(59,130,246,0.8);pointer-events:none;z-index:10}
    @keyframes scanMove{0%,100%{top:5%}50%{top:90%}}
    .corner{position:absolute;width:26px;height:26px;border-color:#3B82F6;border-style:solid;z-index:10}
    .corner.tl{top:8px;left:8px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
    .corner.tr{top:8px;right:8px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
    .corner.bl{bottom:8px;left:8px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
    .corner.br{bottom:8px;right:8px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
    .status-bar{width:100%;max-width:440px;background:#1E293B;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;border:1px solid #334155}
    .dot{width:10px;height:10px;border-radius:50%;background:#64748B;flex-shrink:0;transition:background 0.3s}
    .dot.green{background:#22C55E;box-shadow:0 0 6px #22C55E}
    #statusText{font-size:13px;color:#CBD5E1}
    .last-scan{width:100%;max-width:440px;background:#1E3A5F;border:1.5px solid #3B82F6;border-radius:10px;padding:12px 14px;display:none}
    .last-scan.show{display:block}
    .ls-label{font-size:10px;color:#64748B;text-transform:uppercase;letter-spacing:0.06em}
    .ls-code{font-family:'Courier New',monospace;font-size:22px;font-weight:700;color:#60A5FA;margin-top:2px;word-break:break-all}
    .ls-meta{font-size:12px;color:#94A3B8;margin-top:3px}
    .log-wrap{width:100%;max-width:440px;background:#1E293B;border:1px solid #334155;border-radius:10px;overflow:hidden}
    .log-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #334155;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.06em}
    .log-badge{background:#1D4ED8;color:white;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}
    .log-scroll{max-height:140px;overflow-y:auto}
    .log-empty{padding:14px;text-align:center;color:#475569;font-size:13px}
    .log-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #0F172A;animation:fadeIn 0.2s ease}
    .log-row:last-child{border-bottom:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
    .lc{font-family:'Courier New',monospace;font-size:13px;color:#CBD5E1;flex:1;margin-right:8px;word-break:break-all}
    .lp{background:#1D4ED8;color:#BFDBFE;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;flex-shrink:0}
    .done-btn{width:100%;max-width:440px;background:#185FA5;color:white;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px}
    .done-btn:active{background:#1D4ED8;transform:scale(0.98)}
    .flash{position:fixed;inset:0;background:rgba(59,130,246,0.25);pointer-events:none;opacity:0;transition:opacity 0.05s;z-index:99}
    .flash.on{opacity:1}
    .ios-note{width:100%;max-width:440px;background:#1E293B;border:1px solid #334155;border-radius:10px;padding:12px 14px;font-size:12px;color:#94A3B8;line-height:1.6;display:none}
    .ios-note.show{display:block}
    .ios-note strong{color:#60A5FA}
  </style>
</head>
<body>
  <h1>📷 Barcode Scanner</h1>
  <p class="sub">Hold barcode steady — auto detected</p>

  <div class="video-wrap" id="videoWrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="scan-line"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusText">Starting camera...</span>
  </div>

  <div class="ios-note" id="iosNote">
    <strong>iOS tip:</strong> Hold the barcode <strong>still</strong> for 1-2 seconds inside the frame. Make sure lighting is good. Scanner will beep when detected.
  </div>

  <div class="last-scan" id="lastScan">
    <div class="ls-label">Last Scanned</div>
    <div class="ls-code" id="lsCode"></div>
    <div class="ls-meta" id="lsMeta"></div>
  </div>

  <div class="log-wrap">
    <div class="log-head">Session <span class="log-badge" id="logBadge">0</span></div>
    <div class="log-scroll" id="logBody"><div class="log-empty">Waiting for scan...</div></div>
  </div>

  <button class="done-btn" onclick="sendBack()">✅ Done — Send to Main App</button>
  <div class="flash" id="flash"></div>

  <script>
    let items={}, total=0, lastCode='', lastTime=0, stream=null, detecting=false;

    function setStatus(green, text){
      document.getElementById('dot').className='dot'+(green?' green':'');
      document.getElementById('statusText').textContent=text;
    }

    async function init(){
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:{ideal:'environment'},
            width:{ideal:1920},
            height:{ideal:1080}
          },
          audio:false
        });
        const video=document.getElementById('video');
        video.srcObject=stream;
        await video.play();

        // Check which API is available
        if('BarcodeDetector' in window){
          setStatus(true,'Camera ready — using native scanner');
          document.getElementById('iosNote').classList.add('show');
          startNativeDetector(video);
        } else {
          setStatus(true,'Camera ready — using JS scanner');
          document.getElementById('iosNote').classList.add('show');
          startZXingFallback(video);
        }
      } catch(e){
        setStatus(false,'❌ Camera error: '+(e.name==='NotAllowedError'?'Allow camera access':''+e.message));
      }
    }

    // ── METHOD 1: Native BarcodeDetector (iOS 17+, Chrome Android) ──
    function startNativeDetector(video){
      const detector = new BarcodeDetector({
        formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','qr_code','data_matrix']
      });

      async function detect(){
        if(!stream) return;
        try{
          if(video.readyState >= 2 && !detecting){
            detecting=true;
            const barcodes = await detector.detect(video);
            detecting=false;
            if(barcodes.length > 0){
              const code = barcodes[0].rawValue;
              const now = Date.now();
              if(code && (code!==lastCode || now-lastTime>2000)){
                lastCode=code; lastTime=now;
                onScan(code);
              }
            }
          } else {
            detecting=false;
          }
        } catch(e){ detecting=false; }
        setTimeout(detect, 100); // 10fps — smooth on iOS
      }
      detect();
    }

    // ── METHOD 2: ZXing fallback (older devices) ──
    function startZXingFallback(video){
      const script=document.createElement('script');
      script.src='https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js';
      script.onload=()=>{
        const canvas=document.createElement('canvas');
        const ctx=canvas.getContext('2d');
        const hints=new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
          ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
          ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,
          ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.QR_CODE
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
        const reader=new ZXing.MultiFormatReader();
        reader.setHints(hints);

        function decode(){
          if(!stream) return;
          try{
            if(video.readyState>=2 && video.videoWidth>0){
              canvas.width=video.videoWidth;
              canvas.height=video.videoHeight;
              ctx.drawImage(video,0,0);
              const img=ctx.getImageData(0,0,canvas.width,canvas.height);
              const lum=new ZXing.RGBLuminanceSource(img.data,canvas.width,canvas.height);
              const bin=new ZXing.HybridBinarizer(lum);
              const bmp=new ZXing.BinaryBitmap(bin);
              const result=reader.decode(bmp);
              if(result&&result.text){
                const now=Date.now();
                if(result.text!==lastCode||now-lastTime>2000){
                  lastCode=result.text; lastTime=now;
                  onScan(result.text);
                }
              }
            }
          } catch(e){}
          requestAnimationFrame(decode);
        }
        requestAnimationFrame(decode);
      };
      document.head.appendChild(script);
    }

    // ── On successful scan ──
    function onScan(code){
      items[code]=(items[code]||0)+1;
      total++;
      document.getElementById('lastScan').classList.add('show');
      document.getElementById('lsCode').textContent=code;
      document.getElementById('lsMeta').textContent='Count: '+items[code]+'  |  Total: '+total;
      updateLog();
      doFlash();
      beep();
      setStatus(true,'✅ '+code+' — Ready for next');
    }

    function updateLog(){
      const keys=Object.keys(items);
      document.getElementById('logBadge').textContent=total;
      if(!keys.length){document.getElementById('logBody').innerHTML='<div class="log-empty">Waiting for scan...</div>';return;}
      document.getElementById('logBody').innerHTML=keys.slice().reverse().map(k=>
        `<div class="log-row"><span class="lc">${k}</span><span class="lp">×${items[k]}</span></div>`
      ).join('');
    }

    function sendBack(){
      if(window.opener&&!window.opener.closed){
        window.opener.postMessage({type:'SCANNER_DATA',items:items},'*');
      }
      if(stream) stream.getTracks().forEach(t=>t.stop());
      window.close();
    }

    function doFlash(){
      const f=document.getElementById('flash');
      f.classList.add('on');
      setTimeout(()=>f.classList.remove('on'),150);
    }

    function beep(){
      try{
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=1047;
        g.gain.setValueAtTime(0.2,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
        o.start();o.stop(ctx.currentTime+0.2);
      }catch(e){}
    }

    init();
  </script>
</body>
</html>
